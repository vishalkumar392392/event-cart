apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: aws-secrets
  namespace: ${NAMESPACE}
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "aws-dev"
        objectType: "secretsmanager"
        jmesPath:
          - path: datasourceUrl
            objectAlias: DATASOURCE_URL
          - path: username
            objectAlias: DB_USERNAME
          - path: password
            objectAlias: DB_PASSWORD
          - path: bucketName
            objectAlias: BUCKET_NAME
          - path: queueName
            objectAlias: QUEUE_NAME