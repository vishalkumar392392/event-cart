apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventcart
  namespace: ${NAMESPACE}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: eventcart
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: eventcart
    spec:
      containers:
        - name: eventcart
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: ${REQUEST_CPU}
              memory: ${REQUEST_MEMORY}
            limits:
              cpu: "500m"
              memory: "1024Mi"