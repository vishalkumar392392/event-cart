apiVersion: apps/v1
kind: Deployment
metadata:
  name: eventcart
  namespace: default
  labels:
    app: eventcart
spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: eventcart

  template:
    metadata:
      labels:
        app: eventcart
    spec:
      serviceAccountName: ecr-sa
      containers:
        - name: eventcart
          image: 221082203021.dkr.ecr.us-east-1.amazonaws.com/eventcart:${IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"